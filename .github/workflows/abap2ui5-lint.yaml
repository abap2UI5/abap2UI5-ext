name: abap2ui5-lint

on:
  # abap2UI5-linter: the classes and the views they build, together
  # (abap2ui5lint.jsonc, the findings at adoption in the baseline). The weekly
  # run notices a new linter rule while no pull request is open.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: abap2ui5-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abap2ui5-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npx abap2ui5lint
